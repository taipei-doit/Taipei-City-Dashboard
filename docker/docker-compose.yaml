version: "3.7"

services:
  nginx:
    restart: always
    container_name: nginx
    image: nginx:${NGINX_IMAGE_TAG:-latest}
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - 80:80
      - 443:443

  dashboard-fe:
    image: node:${NODE_IMAGE_TAG:-latest}
    container_name: dashboard-fe
    restart: always
    environment:
      DOCKER_COMPOSE: "true"
      NODE_ENV: ${NODE_ENV}
      VITE_API_URL: ${VITE_API_URL}
      VITE_APP_TITLE: ${VITE_APP_TITLE}
      VITE_APP_VERSION: ${VITE_APP_VERSION}
      VITE_MAPBOXTOKEN: ${VITE_MAPBOXTOKEN}
      VITE_MAPBOXTILE: ${VITE_MAPBOXTILE}
      VITE_TAIPEIPASS_URL: ${TAIPEIPASS_URL}
      VITE_TAIPEIPASS_CLIENT_ID: ${ISSO_CLIENT_ID}
      VITE_TAIPEIPASS_SCOPE: ${ISSO_CLIENT_SCOPE}
    volumes:
      - ../Taipei-City-Dashboard-FE:/opt/Taipei-City-Dashboard-FE
    ports:
      - "8080:80"
    working_dir: /opt/Taipei-City-Dashboard-FE
    command: ["npm", "run", "dev"]

  dashboard-be:
    # image: golang:${GOLANG_IMAGE_TAG:-latest} #Go Lang Image Without Model and onnxruntime
    image: dashboard-be-dev:latest #Local Development
    # image: dashboard-be:latest #Test Prod Image
    build:
      context: ../Taipei-City-Dashboard-BE
      dockerfile: Dockerfile
    container_name: dashboard-be
    restart: always
    environment:
      GIN_MODE: ${GIN_MODE}
      GIN_DOMAIN: ${GIN_DOMAIN}
      GIN_PORT: ${GIN_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET}
      IDNO_SALT: ${IDNO_SALT}
      ISSO_CLIENT_ID: ${ISSO_CLIENT_ID}
      ISSO_CLIENT_SECRET: ${ISSO_CLIENT_SECRET}
      DB_DASHBOARD_HOST: ${DB_DASHBOARD_HOST:-postgres-data}
      DB_DASHBOARD_USER: ${DB_DASHBOARD_USER}
      DB_DASHBOARD_PASSWORD: ${DB_DASHBOARD_PASSWORD}
      DB_DASHBOARD_DBNAME: ${DB_DASHBOARD_DBNAME}
      DB_DASHBOARD_PORT: ${DB_DASHBOARD_PORT:-5432}
      DB_MANAGER_HOST: ${DB_MANAGER_HOST:-postgres-manager}
      DB_MANAGER_USER: ${DB_MANAGER_USER}
      DB_MANAGER_PASSWORD: ${DB_MANAGER_PASSWORD}
      DB_MANAGER_DBNAME: ${DB_MANAGER_DBNAME}
      DB_MANAGER_PORT: ${DB_MANAGER_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LM_MODEL_PATH: ${LM_MODEL_PATH}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embedding:8080}
      AI_TIMEOUT: ${AI_TIMEOUT}
      AI_MAX_RETRY: ${AI_MAX_RETRY}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT}
      TWCC_API_URL: ${TWCC_API_URL}
      TWCC_API_KEY: ${TWCC_API_KEY}
      TWCC_MODEL: ${TWCC_MODEL}
      OPENAI_API_URL: ${OPENAI_API_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      GEMINI_API_URL: ${GEMINI_API_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      AIRFLOW_SUMMARY_BASE_URL: ${AIRFLOW_SUMMARY_BASE_URL}
      AIRFLOW_SUMMARY_SVC_USER: ${AIRFLOW_SUMMARY_SVC_USER}
      AIRFLOW_SUMMARY_SVC_PASS: ${AIRFLOW_SUMMARY_SVC_PASS}

    volumes:
      - ../Taipei-City-Dashboard-BE:/opt/Taipei-City-Dashboard-BE
    working_dir: /opt/Taipei-City-Dashboard-BE
    ports:
      - "8088:${PORT:-8080}"
    depends_on:
      embedding:
        condition: service_healthy
    command: ["go", "run", "main.go"]

  embedding:
    image: dashboard-embedding:latest
    build:
      context: ../Taipei-City-Dashboard-Embedding
      dockerfile: Dockerfile
      target: prod
    container_name: dashboard-embedding
    restart: always
    environment:
      MODEL_NAME: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-base}
      E5_PREFIX: "${EMBEDDING_E5_PREFIX:-query: }"
      MAX_BATCH: ${EMBEDDING_MAX_BATCH:-512}
      MICRO_BATCH: ${EMBEDDING_MICRO_BATCH:-32}
      MAX_SEQ_LEN: ${EMBEDDING_MAX_SEQ_LEN:-512}
      MAX_CHARS: ${EMBEDDING_MAX_CHARS:-8192}
      ORT_INTRA_THREADS: ${EMBEDDING_ORT_INTRA_THREADS:-2}
      ADD_SPECIAL_TOKENS: ${EMBEDDING_ADD_SPECIAL_TOKENS:-false}
    ports:
      - "${EMBEDDING_PORT:-8090}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  vector-db-upgrade:
    build:
      context: ./qdrant-upgrade
      dockerfile: Dockerfile
    image: dashboard-vector-upgrade:latest
    container_name: vector-db-upgrade
    environment:
      DB_MANAGER_HOST: ${DB_MANAGER_HOST:-postgres-manager}
      DB_MANAGER_USER: ${DB_MANAGER_USER}
      DB_MANAGER_PASSWORD: ${DB_MANAGER_PASSWORD}
      DB_MANAGER_DBNAME: ${DB_MANAGER_DBNAME}
      DB_MANAGER_PORT: ${DB_MANAGER_PORT:-5432}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-gogosecurity}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-query_charts}

networks:
  default:
    name: br_dashboard
    external: true
