{{- if and .Values.embedding .Values.embedding.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taipei-city-dashboard.fullname" . }}-embedding
  labels:
    {{- include "taipei-city-dashboard.embedding.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.embedding.replicaCount }}
  strategy:
    type: {{ default "RollingUpdate" .Values.embedding.updateStrategy.type }}
    {{- if and .Values.embedding.updateStrategy.rollingUpdate (eq (default "RollingUpdate" .Values.embedding.updateStrategy.type) "RollingUpdate") }}
    rollingUpdate:
      maxSurge: {{ .Values.embedding.updateStrategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.embedding.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "taipei-city-dashboard.embedding.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taipei-city-dashboard.embedding.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taipei-city-dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: embedding
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "taipei-city-dashboard.image" (merge (dict "repository" .Values.embedding.image.repository "tag" .Values.embedding.image.tag) .) }}
          {{- with .Values.embedding.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.embedding.service.targetPort }}
              protocol: TCP
          # 載入 ONNX 模型需要時間，先用 startupProbe 擋住 liveness
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.embedding.resources | nindent 12 }}
          env:
            {{- range $key, $value := .Values.embedding.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
