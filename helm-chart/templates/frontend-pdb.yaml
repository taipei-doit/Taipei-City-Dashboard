{{- if and .Values.frontend.enabled (hasKey .Values.frontend "pdb") (hasKey .Values.frontend.pdb "enabled") .Values.frontend.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "taipei-city-dashboard.fullname" . }}-frontend-pdb
  labels:
    {{- include "taipei-city-dashboard.frontend.labels" . | nindent 4 }}
spec:
  {{- if and (hasKey .Values.frontend.pdb "minAvailable") .Values.frontend.pdb.minAvailable }}
  minAvailable: {{ .Values.frontend.pdb.minAvailable }}
  {{- else if and (hasKey .Values.frontend.pdb "maxUnavailable") .Values.frontend.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.frontend.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taipei-city-dashboard.frontend.selectorLabels" . | nindent 6 }}
{{- end }}
