# Local development values for in-cluster deployment
# Use this for local development with in-cluster PostgreSQL and Redis

# Global configuration
global:
  imageRegistry: ""

# Azure Key Vault - disabled for local development
azureKeyVault:
  enabled: false

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/taipei-doit/taipei-city-dashboard-fe
    tag: "latest"
    pullPolicy: Always
  
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Development environment variables (non-sensitive)
  env:
    NODE_ENV: "development"
    VITE_API_URL: "http://localhost:30088"
    VITE_APP_TITLE: "Taipei Dashboard (Local)"
    VITE_APP_VERSION: "2.2.0-dev"
    VITE_MAPBOXTOKEN: "your-dev-mapbox-token"
    VITE_MAPBOXTILE: "mapbox://styles/mapbox/light-v10"
    VITE_TAIPEIPASS_URL: "https://id-dev.taipei.gov.tw"
    VITE_TAIPEIPASS_CLIENT_ID: "dev-client-id"
    VITE_TAIPEIPASS_SCOPE: "openid profile"

# Backend configuration
backend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/taipei-doit/taipei-city-dashboard-be
    tag: "latest"
    pullPolicy: Always
  
  service:
    type: NodePort
    port: 8080
    nodePort: 30088
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  
  # Development environment variables (non-sensitive)
  env:
    GIN_MODE: "debug"
    GIN_DOMAIN: "localhost"
    GIN_PORT: "8080"
    JWT_SECRET: "dev-jwt-secret-key"
    IDNO_SALT: "dev-salt"
    ISSO_CLIENT_ID: "dev-client-id"
    ISSO_CLIENT_SECRET: "dev-client-secret"

# Service Account
serviceAccount:
  create: true
  annotations: {}

# Ingress - disabled for local development
ingress:
  enabled: false

# Autoscaling - disabled for development
autoscaling:
  enabled: false

# Security - relaxed for development
securityContext:
  runAsNonRoot: false
  runAsUser: 0

# Database Configuration - Use in-cluster databases for local development
externalDatabase:
  enabled: false

externalRedis:
  enabled: false

# PostgreSQL for local development
postgresql:
  enabled: true
  auth:
    postgresPassword: "password"
    username: "postgres"
    password: "password"
    database: "dashboard"
  primary:
    persistence:
      enabled: false  # Disable persistence for easy cleanup
    service:
      type: NodePort
      nodePorts:
        postgresql: 30432
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Redis for local development
redis:
  enabled: true
  auth:
    enabled: false  # Disabled for easier local development
  master:
    persistence:
      enabled: false  # Disable persistence for easy cleanup
    service:
      type: NodePort
      nodePorts:
        redis: 30379
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Monitoring - disabled for development
monitoring:
  enabled: false
