# Development values for local testing
# Use this for development and testing environments

# Global configuration
global:
  imageRegistry: ""

# Azure Key Vault - disabled for local development
azureKeyVault:
  enabled: false

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: taipei-city-dashboard-fe
    tag: "latest"
    pullPolicy: Always
  
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Development environment variables (non-sensitive)
  env:
    NODE_ENV: "development"
    VITE_API_URL: "http://localhost:30088"
    VITE_APP_TITLE: "Taipei Dashboard (Dev)"
    VITE_APP_VERSION: "2.2.0-dev"
    VITE_MAPBOXTOKEN: "your-dev-mapbox-token"
    VITE_MAPBOXTILE: "mapbox://styles/mapbox/light-v10"
    VITE_TAIPEIPASS_URL: "https://id-dev.taipei.gov.tw"
    VITE_TAIPEIPASS_CLIENT_ID: "dev-client-id"
    VITE_TAIPEIPASS_SCOPE: "openid profile"

# Backend configuration
backend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: taipei-city-dashboard-be
    tag: "latest"
    pullPolicy: Always
  
  service:
    type: NodePort
    port: 8080
    nodePort: 30088
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  
  # Development environment variables (non-sensitive)
  env:
    GIN_MODE: "debug"
    GIN_DOMAIN: "localhost"
    GIN_PORT: "8080"
    JWT_SECRET: "dev-jwt-secret-key"
    IDNO_SALT: "dev-salt"
    ISSO_CLIENT_ID: "dev-client-id"
    ISSO_CLIENT_SECRET: "dev-client-secret"
    DB_DASHBOARD_HOST: "localhost"
    DB_DASHBOARD_USER: "postgres"
    DB_DASHBOARD_PASSWORD: "password"
    DB_DASHBOARD_DBNAME: "dashboard"
    DB_DASHBOARD_PORT: "5432"
    DB_MANAGER_HOST: "localhost"
    DB_MANAGER_USER: "postgres"
    DB_MANAGER_PASSWORD: "password"
    DB_MANAGER_DBNAME: "manager"
    DB_MANAGER_PORT: "5433"
    REDIS_HOST: "localhost"
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ""
    REDIS_DB: "0"

# Service Account
serviceAccount:
  create: true
  annotations: {}

# Ingress - disabled for development
ingress:
  enabled: false

# Autoscaling - disabled for development
autoscaling:
  enabled: false

# Security - relaxed for development
securityContext:
  runAsNonRoot: false
  runAsUser: 0

# Database Configuration - Use in-cluster databases for development
externalDatabase:
  enabled: false

externalRedis:
  enabled: false

# PostgreSQL for development
postgresql:
  enabled: true
  auth:
    postgresPassword: "password"
    username: "postgres"
    password: "password"
    database: "dashboard"
  primary:
    persistence:
      enabled: false
    service:
      type: NodePort
      nodePort: 30432

# Redis for development
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
    service:
      type: NodePort
      nodePort: 30379

# Monitoring - disabled for development
monitoring:
  enabled: false
