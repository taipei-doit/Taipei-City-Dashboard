# Community/Open Source deployment values
# Use this configuration for deploying with external databases (non-Azure)
# Suitable for community users with their own database infrastructure

# Global configuration
global:
  imageRegistry: ""  # Use Docker Hub or your registry

# Disable Azure Key Vault (not available to community users)
azureKeyVault:
  enabled: false

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: taipei-city-dashboard-fe
    tag: "2.2.0"
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  # Frontend environment variables (update these values)
  env:
    NODE_ENV: "production"
    VITE_API_URL: "https://your-api-domain.com"
    VITE_APP_TITLE: "Taipei City Dashboard"
    VITE_APP_VERSION: "2.2.0"
    VITE_MAPBOXTOKEN: "your-mapbox-token"
    VITE_MAPBOXTILE: "mapbox://styles/mapbox/light-v10"
    VITE_TAIPEIPASS_URL: "https://your-auth-service.com"
    VITE_TAIPEIPASS_CLIENT_ID: "your-oauth-client-id"
    VITE_TAIPEIPASS_SCOPE: "openid profile email"

# Backend configuration  
backend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: taipei-city-dashboard-be
    tag: "2.2.0"
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  # Backend environment variables (update these values)
  env:
    GIN_MODE: "release"
    GIN_DOMAIN: "your-api-domain.com"
    GIN_PORT: "8080"
    JWT_SECRET: "your-jwt-secret-key"
    IDNO_SALT: "your-salt-value"
    ISSO_CLIENT_ID: "your-oauth-client-id"
    ISSO_CLIENT_SECRET: "your-oauth-client-secret"

# External Database Configuration
# Configure these settings for your external PostgreSQL database
externalDatabase:
  enabled: true
  
  dashboard:
    host: "your-postgres-host.example.com"      # Replace with your PostgreSQL host
    port: 5432
    database: "dashboard"                        # Database name
    username: "dashboard_user"                   # Database username
    password: "your-secure-password"             # Database password (consider using Kubernetes secrets)
    sslMode: "require"                          # SSL mode: disable, require, verify-ca, verify-full
    
    # Connection pool settings
    maxOpenConns: 25
    maxIdleConns: 5
    connMaxLifetime: "5m"
  
  # Optional: Use separate manager database
  manager:
    enabled: false  # Set to true if you want a separate manager database
    # If enabled, configure the same settings as dashboard above

# External Redis Configuration
# Configure these settings for your external Redis instance
externalRedis:
  enabled: true
  
  host: "your-redis-host.example.com"          # Replace with your Redis host
  port: 6379
  password: "your-redis-password"               # Redis password (if required)
  database: 0                                   # Redis database number
  
  # SSL/TLS configuration (if your Redis supports SSL)
  tls:
    enabled: false                              # Set to true if using SSL
    insecureSkipVerify: false

# Disable in-cluster databases
postgresql:
  enabled: false

redis:
  enabled: false

# Service Account (standard Kubernetes)
serviceAccount:
  create: true
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: your-dashboard-domain.com           # Replace with your domain
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: dashboard-tls
      hosts:
        - your-dashboard-domain.com

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Monitoring (optional)
monitoring:
  enabled: false  # Enable if you have Prometheus installed

# Security context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

# Node affinity (optional - for multi-zone deployment)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - taipei-city-dashboard
        topologyKey: kubernetes.io/hostname
