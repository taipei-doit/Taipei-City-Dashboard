<h2 id="mirofish-%E8%BC%BF%E6%83%85%E6%A8%A1%E6%93%AC">MiroFish 輿情模擬</h2>
<p><strong>三種輸入種子</strong>：</p>
<ul>
<li>過去：歷史颱風新聞、NCDR 災損紀錄、納莉/蘇迪勒案例</li>
<li>現在：CWA、data.taipei、TDX 即時 API</li>
<li>未來：預製復合災難假設文件（合成 proxy）</li>
</ul>

<h2 id="%E8%B3%87%E6%96%99%E6%B8%85%E7%90%86%E6%B5%81%E7%A8%8B6-%E6%AD%A5%E9%A9%9F">資料清理流程（6 步驟）</h2>
<p><strong>Layer A — 即時 API</strong>：CWA 氣象/地震、data.taipei 淹水感測、TDX 交通<br />
<strong>Layer B — 靜態參考</strong>：雙北避難收容、人口老化指數（年度預下載）<br />
<strong>Layer C — 歷史種子</strong>：NCDR 災損、颱風新聞（丟給 MiroFish）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Step 1  拉取 + 快取 → PostgreSQL（標記 source、fetched_at）
Step 2  地理編碼標準化 → 全部轉 WGS84 + 行政區碼（5碼）
Step 3  欄位對映驗證 → 統一 schema，計算脆弱性 proxy
Step 4  Join：避難缺口 = 脆弱人口 - 總收容容量
Step 5  合成 proxy 文件 → 每個劇本的未來假設情境種子
Step 6  寫入 Component/QueryChart（CT=Metro-Taipei）
</code></pre>
</section>
