id: daily_bike_path
namespace: tpe_city_dashboard.daily
description: |
  自行車路網每日更新（台北 20:00）

  原始 Airflow DAG: proj_city_dashboard.bike_path
  Airflow queue: daily → 依 hash 落在 default 或 heavy
  行為：從 TDX API 抓 Taipei Cycling Shape，轉 MultiLineStringZ，
        寫入 bike_network_tpe（PostGIS）。

labels:
  queue: default
  migrated_from: airflow
  source_dag_id: proj_city_dashboard_bike_path

tasks:
  - id: etl
    type: io.kestra.plugin.scripts.python.Commands
    description: 呼叫 bike_path 的 _transfer 函式
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: taipei-de-etl:latest
      pullPolicy: NEVER
      volumes:
        - "{{ envs.de_dags_host_path }}:/opt/airflow/dags:ro"
    env:
      PYTHONPATH: "/opt/adapters:/opt/airflow/dags"
      DAG_PATH: /opt/airflow/dags
      DATA_PATH: /opt/airflow/data
      READY_DATA_DB_URI: "{{ envs.ready_data_db_uri }}"
      RAW_DATA_DB_URI: "{{ envs.raw_data_db_uri }}"
      DASHBOARD_DB_URI: "{{ envs.dashboard_db_uri }}"
      AIRFLOW_VAR_DEFAULT_EMAIL_LIST: "[]"
    commands:
      - python /opt/adapters/run_etl.py proj_city_dashboard bike_path

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 20 * * *"
    timezone: Asia/Taipei
