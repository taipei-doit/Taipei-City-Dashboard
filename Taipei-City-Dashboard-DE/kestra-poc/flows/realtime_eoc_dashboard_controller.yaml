id: realtime_eoc_dashboard_controller
namespace: tpe_city_dashboard.realtime
description: |
  EOC 儀表板控制器（每 5 分鐘執行）

  原始 Airflow DAG: proj_city_dashboard.eoc_dashboard_controller
  Airflow queue: realtime
  行為：比對 eoc_damage_case_tpe / eoc_disaster_summary_tpe 的 24h 內事件，
        依 dp_name 動態建立或清除 dashboard / components / charts。

  這個 flow 會讀取原本的 _transfer 函式，不重寫任何 ETL 邏輯。

labels:
  queue: realtime
  migrated_from: airflow
  source_dag_id: proj_city_dashboard_eoc_dashboard_controller

tasks:
  - id: etl
    type: io.kestra.plugin.scripts.python.Commands
    description: 呼叫 eoc_dashboard_controller 的 _transfer 函式
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: taipei-de-etl:latest
      pullPolicy: NEVER
      volumes:
        - "{{ envs.de_dags_host_path }}:/opt/airflow/dags:ro"
    env:
      PYTHONPATH: "/opt/adapters:/opt/airflow/dags"
      DAG_PATH: /opt/airflow/dags
      DATA_PATH: /opt/airflow/data
      READY_DATA_DB_URI: "{{ envs.ready_data_db_uri }}"
      RAW_DATA_DB_URI: "{{ envs.raw_data_db_uri }}"
      DASHBOARD_DB_URI: "{{ envs.dashboard_db_uri }}"
      AIRFLOW_VAR_DEFAULT_EMAIL_LIST: "[]"
    commands:
      - python /opt/adapters/run_etl.py proj_city_dashboard eoc_dashboard_controller

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    timezone: Asia/Taipei

# retries / 通知建議正式上線時加：
# retry:
#   type: constant
#   interval: PT1M
#   maxAttempt: 2
