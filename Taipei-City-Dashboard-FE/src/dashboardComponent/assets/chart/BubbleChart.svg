<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
	<title>網站圖表ICON - 泡泡圖</title>
	<style>
		.s-axis { fill: none; stroke: #000000; opacity: 0.3; stroke-width: 10; stroke-linecap: round }
		.s-bubble-a { fill: #000000; opacity: 0.3 }
		.s-bubble-b { fill: #000000; opacity: 0.55 }
		.s-bubble-c { fill: #000000; opacity: 0.75 }
	</style>
	<g id="bubble">
		<!-- 軸線（X / Y） -->
		<path id="axis-y" class="s-axis" d="M180 140 L180 880" />
		<path id="axis-x" class="s-axis" d="M180 880 L880 880" />
		<!-- 三顆代表性泡泡 -->
		<circle class="s-bubble-a" cx="350" cy="640" r="120" />
		<circle class="s-bubble-b" cx="560" cy="380" r="180" />
		<circle class="s-bubble-c" cx="780" cy="560" r="80" />
	</g>
</svg>
