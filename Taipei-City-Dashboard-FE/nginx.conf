server {
    listen 8081;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect all logs to stdout/stderr for container logging
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Road name lookup proxy for map.com.tw, avoids browser CORS failures
    location /map_engine/ {
        proxy_pass https://www.map.com.tw/map_engine/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host www.map.com.tw;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Handle SPA routing: all paths should fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom error pages (optional but good practice)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

