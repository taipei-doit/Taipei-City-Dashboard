                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GreenStorePoint'
              example:
                status: success
                data:
                  - source_dataset: tpe_00002657
