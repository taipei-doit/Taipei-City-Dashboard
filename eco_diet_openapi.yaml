  # ─────────────────────────── C5 ───────────────────────────
  /eco_diet/waste/yearly:
    get:
      tags: [eco_diet_waste]
      summary: C5 — 雙北年度廢棄物趨勢（含廚餘）
      description: |
        回傳臺北、新北逐年廢棄物相關 4 個指標：**廚餘量** / **一般垃圾** / **資源垃圾** / **總產生量**。
        雙北 × 4 metric → 共 **8 條 series**。FE 可全部畫進一張 LineChart，
        或在前端依 `name` 子串過濾出單一城市 / 單一 metric 的視圖（如「廚餘 vs 一般垃圾比例」）。

        對應資料表 `gov_open_waste_yearly`（DE plan §6.6.2）：

        | metric_label | 對應欄位 | 語意 |
        |---|---|---|
        | `廚餘量` | `food_wastes_recycled` | 廚餘回收量 |
        | `一般垃圾` | `garbage_clearance` | 焚化／掩埋的一般垃圾 |
        | `資源垃圾` | `garbage_recycled` | 資源回收（紙類、塑膠等） |
        | `總產生量` | `garbage_generated` | 一般廢棄物總產生量 |

        **SQL**
        ```sql
        WITH yearly AS (
          SELECT data_year, county,
                 food_wastes_recycled, garbage_clearance,
                 garbage_recycled, garbage_generated
          FROM gov_open_waste_yearly
          WHERE county IN ('臺北市', '新北市')
        )
        SELECT data_year::text AS x_axis, '' AS icon,
               county || '-廚餘量' AS y_axis,
               ROUND(food_wastes_recycled)::int AS data FROM yearly
        UNION ALL
        SELECT data_year::text, '', county || '-一般垃圾',
               ROUND(garbage_clearance)::int   FROM yearly
        UNION ALL
        SELECT data_year::text, '', county || '-資源垃圾',
               ROUND(garbage_recycled)::int    FROM yearly
        UNION ALL
        SELECT data_year::text, '', county || '-總產生量',
               ROUND(garbage_generated)::int   FROM yearly
        ORDER BY x_axis, y_axis;
        ```

        **單位**：公噸/年（tonnes/year）。`ThreeDimensionalDataOutput.Data` 既有型別為 `[]int`，
        SQL 端 `ROUND(...)::int` 取整數；雙北年度廢棄物量級在數萬至百萬公噸，整數精度足夠。

        **Series 命名約定**：`{county}-{metric_label}`，如 `臺北市-廚餘量`、`新北市-總產生量`。
        FE 用 `series.name.split('-')` 即可拆解城市與指標兩個維度。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: 8 條 series（雙北 × 4 metric）
                        items:
                          $ref: '#/components/schemas/ThreeDimensionalDataOutput'
                      categories:
                        type: array
                        description: X 軸年度標籤
                        items:
                          type: string
                        example: ['2018', '2019', '2020', '2021', '2022', '2023']
              example:
                status: success
                data:
                  - name: '臺北市-廚餘量'
                    icon: ''
                    data: [62458, 64320, 65180, 63927, 60815, 58432]
                  - name: '臺北市-一般垃圾'
                    icon: ''
                    data: [712380, 698250, 685120, 672400, 658730, 642510]
                  - name: '臺北市-資源垃圾'
                    icon: ''
                    data: [398240, 412580, 425130, 432670, 438920, 445280]
                  - name: '臺北市-總產生量'
                    icon: ''
                    data: [1173078, 1175150, 1175430, 1168997, 1158465, 1146222]
                  - name: '新北市-廚餘量'
                    icon: ''
                    data: [78213, 81045, 82960, 80517, 76842, 73598]
                  - name: '新北市-一般垃圾'
                    icon: ''
                    data: [892450, 875320, 858610, 841850, 825740, 808920]
                  - name: '新北市-資源垃圾'
                    icon: ''
                    data: [521380, 538720, 552180, 561420, 569350, 577810]
                  - name: '新北市-總產生量'
                    icon: ''
                    data: [1492043, 1495087, 1493750, 1483787, 1471932, 1460328]
                categories: ['2018', '2019', '2020', '2021', '2022', '2023']
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────── C5b ───────────────────────────
  /eco_diet/waste/carbon_footprint_yearly:
    get:
      tags: [eco_diet_waste]
      summary: C5b — 雙北年度廢棄物碳足跡
      description: |
        以 C5 同表 `gov_open_waste_yearly` 的 3 個量值欄位（廚餘 / 一般垃圾 / 資源垃圾），
        乘上 repo 根目錄 `coal_emission.csv` 萃取的「平均碳足跡係數」，
        加總得出雙北每年的**廢棄物總碳足跡**（公噸 CO2e/年）。
        雙北 × 1 metric → 共 **2 條 series**。

        **平均碳足跡係數**（kg CO2e / 公噸 廢棄物，來源 `coal_emission.csv`）

        | metric_label | 對應 DB 欄位 | 樣本來源 | 平均係數 |
        |---|---|---|---|
        | 廚餘 | `food_wastes_recycled` | 有機廢棄物免發酵轉化肥料處理服務（n=1） | **48.3** |
        | 一般垃圾 | `garbage_clearance` | 4 座都市垃圾焚化廠平均（永康/城西/苗栗/岡山，n=4） | **340** |
        | 資源垃圾 | `garbage_recycled` | 再生料-廢*容器- 系列（n=10，0.369 kg/kg → 369 kg/公噸） | **369** |

        **SQL**
        ```sql
        SELECT data_year::text AS x_axis, '' AS icon,
               county || '-碳足跡' AS y_axis,
               ROUND(
                   food_wastes_recycled * 0.0483 +
                   garbage_clearance    * 0.340  +
                   garbage_recycled     * 0.369
               )::int AS data
        FROM gov_open_waste_yearly
        WHERE county IN ('臺北市', '新北市')
        ORDER BY x_axis, y_axis;
        ```

        **單位**：公噸 CO2e/年。係數 0.0483 / 0.340 / 0.369 = 公噸 CO2e/公噸 廢棄物
        （由 kg/公噸 同除 1000 換算，使輸入/輸出單位一致）。

        **Series 命名約定**：`{county}-碳足跡`，如 `臺北市-碳足跡`、`新北市-碳足跡`。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: 2 條 series（雙北各一條總碳足跡）
                        items:
                          $ref: '#/components/schemas/ThreeDimensionalDataOutput'
                      categories:
                        type: array
                        description: X 軸年度標籤
                        items:
                          type: string
                        example: ['2018', '2019', '2020', '2021', '2022', '2023']
              example:
                status: success
                data:
                  - name: '臺北市-碳足跡'
                    icon: ''
                    data: [392177, 386394, 381218, 374538, 368121, 361546]
                  - name: '新北市-碳足跡'
                    icon: ''
                    data: [499123, 492480, 487127, 480244, 472810, 466281]
                categories: ['2018', '2019', '2020', '2021', '2022', '2023']
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────── C7a ───────────────────────────
  /eco_diet/food_bank/points:
    get:
      tags: [eco_diet_food_bank]
      summary: C7a — 實物銀行全量點位
      description: |
        回傳所有雙北實物銀行（約 80 筆：臺北 23 + 新北 57）。
        相比 C1a / C4，多回 `address` / `tel` 兩個欄位（FE 點擊卡片時直接顯示，省一次 detail API）。

        **SQL**
        ```sql
        SELECT
          source_dataset, seq_no, name, org_type,
          city, district, district_code, postal_code,
          address, tel, lng, lat
        FROM food_bank
        WHERE wkb_geometry IS NOT NULL
        ORDER BY city, district, name;
        ```

        **欄位差異**：
        - 臺北側 (`tpe_00003431`) `org_type` = `'實物銀行'`；新北側 (`ntpe_1c1d0066`) `org_type` 為 `null`/空字串（DE plan §11 修正 #6 已記錄）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FoodBankPoint'
              example:
                status: success
                data:
                  - source_dataset: tpe_00003431
                    seq_no: '1'
                    name: '中山社會福利服務中心'
                    org_type: '實物銀行'
                    city: '臺北市'
                    district: '中山區'
                    district_code: '63000040'
                    postal_code: null
                    address: '臺北市中山區合江街137號3樓'
                    tel: null
                    lng: 121.5430
                    lat: 25.0596
                  - source_dataset: ntpe_1c1d0066
                    seq_no: '1'
                    name: '板橋第一社會福利服務中心'
                    org_type: ''
                    city: '新北市'
                    district: '板橋區'
                    district_code: '65000010'
                    postal_code: '220677'
                    address: '新北市板橋區漢生東路258號三樓'
                    tel: '(02)29537301'
                    lng: 121.4658
                    lat: 25.0231
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────── C7b ───────────────────────────
  /eco_diet/food_bank/nearby:
    get:
      tags: [eco_diet_food_bank]
      summary: C7b — 最近實物銀行（Haversine 排序）
      description: |
        以使用者座標為中心，依 Haversine 大圓距離排序所有實物銀行；可選擇 `limit` 取前 N 筆。
        對齊 mrtA11y 既有 [`GetMrtStationsNearby`](../Taipei-City-Dashboard-BE/app/models/mrtA11y.go#L179) 實作（Go side 計算、無 PostGIS 空間查詢）。

        **演算法**：BE 載入 `food_bank` 全量 80 筆 → 對每筆計算 Haversine 距離 → 升冪排序 → 切前 `limit` 筆。
      parameters:
        - in: query
          name: lat
          required: true
          description: 使用者所在緯度（WGS84）
          schema:
            type: number
            format: double
            example: 25.0330
        - in: query
          name: lng
          required: true
          description: 使用者所在經度（WGS84）
          schema:
            type: number
            format: double
            example: 121.5654
        - in: query
          name: limit
          required: false
          description: 取最近的 N 筆。省略時回全部 80 筆（依距離升冪排序）。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 3
            example: 3
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FoodBankPointNearby'
              example:
                status: success
                data:
                  - source_dataset: tpe_00003431
                    seq_no: '2'
                    name: '信義社會福利服務中心'
                    org_type: '實物銀行'
                    city: '臺北市'
                    district: '信義區'
                    district_code: '63000080'
                    postal_code: null
                    address: '臺北市信義區松仁路100號'
                    tel: null
                    lng: 121.5680
                    lat: 25.0349
                    distance_m: 337
                  - source_dataset: tpe_00003431
                    seq_no: '3'
                    name: '大安社會福利服務中心'
                    org_type: '實物銀行'
                    city: '臺北市'
                    district: '大安區'
                    district_code: '63000060'
                    postal_code: null
                    address: '臺北市大安區四維路198巷30弄14-1號'
                    tel: null
                    lng: 121.5489
                    lat: 25.0263
                    distance_m: 1822
                  - source_dataset: tpe_00003431
                    seq_no: '1'
                    name: '中山社會福利服務中心'
                    org_type: '實物銀行'
                    city: '臺北市'
                    district: '中山區'
                    district_code: '63000040'
                    postal_code: null
                    address: '臺北市中山區合江街137號3樓'
                    tel: null
                    lng: 121.5430
                    lat: 25.0596
                    distance_m: 3720
        '400':
          description: 缺少 lat / lng 或數值不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: error
                message: 'lat and lng are required'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    # ─── 通用信封 ────────────────────────────────────────────
    SuccessEnvelope:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [success]
          example: success

    ErrorEnvelope:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
          example: error
        message:
          type: string
          example: 'pq: relation "eco_restaurant" does not exist'

    # ─── 沿用 componentData.go 既有型別 ─────────────────────
    TwoDimensionalData:
      description: |
        對應 Go struct `models.TwoDimensionalData`（[componentData.go:37](../Taipei-City-Dashboard-BE/app/models/componentData.go#L37)）。
        `x` 是類別字串、`y` 是 float64 聚合值。
      type: object
      required: [x, y]
      properties:
        x:
          type: string
          example: '松山區'
        y:
          type: number
          format: double
          example: 38

    TwoDimensionalDataOutput:
      description: |
        對應 Go struct `models.TwoDimensionalDataOutput`（[componentData.go:41](../Taipei-City-Dashboard-BE/app/models/componentData.go#L41)）。
        Controller 一律回傳 `[]TwoDimensionalDataOutput`（雙層陣列）；本儀表板 C1b/C2 外層 array 永遠只有 1 個元素。
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TwoDimensionalData'

    ThreeDimensionalDataOutput:
      description: |
        對應 Go struct `models.ThreeDimensionalDataOutput`（[componentData.go:67](../Taipei-City-Dashboard-BE/app/models/componentData.go#L67)）。
        每個元素是一條 series；`name` 為 series 名（本儀表板為城市名）、`data` 與頂層 `categories` 索引對齊。
      type: object
      required: [name, icon, data]
      properties:
        name:
          type: string
          description: Series 名稱
          example: '臺北市'
        icon:
          type: string
          description: 預留欄位，目前一律回空字串
          example: ''
        data:
          type: array
          description: 與頂層 `categories` 索引對齊的整數陣列
          items:
            type: integer
            format: int32
          example: [62458, 64320, 65180, 63927, 60815, 58432]

    # ─── 新增領域 struct（對齊 mrtA11y 既有 pattern）────────
    EcoRestaurantPoint:
      description: |
        環保餐廳點位資料。對應未來新增的 Go struct `models.EcoRestaurantPoint`，
        參考 [`MrtA11yStation`](../Taipei-City-Dashboard-BE/app/models/mrtA11y.go#L26) 既有 pattern。
      type: object
      required: [source_dataset, name, address, city, lng, lat, env_actions]
      properties:
        source_dataset:
          type: string
          enum: ['tpe_00002761', 'ntpe_e90d14f8']
          description: 資料來源（區分臺北 / 新北 API）
          example: 'tpe_00002761'
        seq_no:
          type: string
          description: 來源 API 自然 key（對齊 DE plan unique constraint）
          example: '1'
        name:
          type: string
          example: '《扶風堂》披薩。義麵。吉拉朵'
        address:
          type: string
          description: Geocode 後標準化地址
          example: '臺北市松山區敦化北路165巷5號1樓'
        city:
          type: string
          enum: ['臺北市', '新北市']
          example: '臺北市'
        district:
          type: string
          nullable: true
          description: 從地址 regex 抽取，少數無法抽取時為 null
          example: '松山區'
        tel:
          type: string
          nullable: true
          example: '(02)27153377'
        env_actions:
          type: array
          description: |
            額外環保作為標籤（多選）。**僅臺北市資料具備**；
            新北市資料一律為 `[]`（DE plan §11 修正 #3）。
            常見值：`環境管理` / `惜食(善用食材)` / `環境教育` / `綠色採購` 等。
          items:
            type: string
          example: ['環境管理', '惜食(善用食材)', '環境教育']
        lng:
          type: number
          format: double
          description: |
            WGS84 經度。BE 已過濾 lng/lat NULL 的 row（geocode 失敗的資料），
            所以這個欄位**保證有效**，FE 可以直接畫 marker。
          example: 121.5495
        lat:
          type: number
          format: double
          description: WGS84 緯度。語意同上 `lng`，保證有效。
          example: 25.0556

    GreenStorePoint:
      description: 綠色商店點位資料。對應未來新增的 Go struct `models.GreenStorePoint`。
      type: object
      required: [source_dataset, name, address, city, lng, lat]
      properties:
        source_dataset:
          type: string
          enum: ['tpe_00002657', 'ntpe_6ccd0274']
          example: 'tpe_00002657'
        store_code:
          type: string
          description: 商店編號（臺北 `商店編號` / 新北 `number`）
          example: 'A000204'
        name:
          type: string
          example: '7-11OPEN門市'
        address:
          type: string
          example: '臺北市士林區基河路128號'
        city:
          type: string
          enum: ['臺北市', '新北市']
        district:
          type: string
          nullable: true
        tel:
          type: string
          nullable: true
        store_type:
          type: string
          enum: ['連鎖型綠色商店', '一般型綠色商店']
          example: '連鎖型綠色商店'
        lng:
          type: number
          format: double
          description: |
            WGS84 經度。BE 已過濾 lng/lat NULL 的 row，FE 可以直接畫 marker。
        lat:
          type: number
          format: double
          description: WGS84 緯度。語意同上 `lng`。

    FoodBankPoint:
      description: |
        實物銀行點位資料。對齊 DE plan §6.5.2 schema，包含全部 12 個非 DB-internal 欄位。

        **欄位差異提示**（DE plan §1.1 / §11 修正 #6）：
        - `org_type`：臺北側 (`tpe_00003431`) 固定 `'實物銀行'`；新北側 (`ntpe_1c1d0066`) 來源無此欄，落庫為空字串/null。
        - `postal_code`：臺北側 S5 來源無 `postalcode` 欄，落庫為 null；新北側 S6 有值（如 `'220677'`）。
        - `tel`：臺北側 S5 sample 未列出 phone 欄位（DE plan §1.1），可能多數為 null；新北側來自 `localcallservice`，有值。
        - `district_code`：臺北側為 `'63000xxx'`（如 `63000040 = 中山區`）；新北側為 `'65000xxx'`（如 `65000010 = 板橋區`）。
      type: object
      required: [source_dataset, name, address, city, lng, lat]
      properties:
        source_dataset:
          type: string
          enum: ['tpe_00003431', 'ntpe_1c1d0066']
          example: 'tpe_00003431'
        seq_no:
          type: string
          example: '1'
        name:
          type: string
          description: 機構名稱（臺北 `機構名稱` / 新北 `title`）
          example: '中山社會福利服務中心'
        org_type:
          type: string
          nullable: true
          example: '實物銀行'
        city:
          type: string
          enum: ['臺北市', '新北市']
        district:
          type: string
          nullable: true
          example: '中山區'
        district_code:
          type: string
          nullable: true
          description: |
            行政區代碼（臺北 `行政區代碼` / 新北 `areacode`）。
            臺北範例：`63000040 = 中山區`；新北範例：`65000010 = 板橋區`。
          example: '63000040'
        postal_code:
          type: string
          nullable: true
          description: 郵遞區號；**僅新北側 (`postalcode`) 具備**，臺北側為 null。
          example: '220677'
        address:
          type: string
          example: '臺北市中山區合江街137號3樓'
        tel:
          type: string
          nullable: true
          description: 電話；**新北側來自 `localcallservice`**，臺北側 S5 sample 未列出此欄位，可能多數為 null。
          example: '(02)29537301'
        lng:
          type: number
          format: double
          description: |
            WGS84 經度。BE 已過濾 lng/lat NULL 的 row（geocode 失敗的食物銀行），
            FE 可以直接畫 marker。C7b `nearby` 距離計算同樣只考慮已 geocode 的 row。
        lat:
          type: number
          format: double
          description: WGS84 緯度。語意同上 `lng`。

    FoodBankPointNearby:
      description: |
        實物銀行點位 + Haversine 距離。對應未來新增的 Go struct `models.FoodBankPointNearby`，
        嵌入 `FoodBankPoint` 並補一個 `distance_m` 欄位（對齊 [`MrtA11yStationNearby`](../Taipei-City-Dashboard-BE/app/models/mrtA11y.go#L171)）。
      allOf:
        - $ref: '#/components/schemas/FoodBankPoint'
        - type: object
          required: [distance_m]
          properties:
            distance_m:
              type: integer
              description: 距離使用者座標（公尺，整數四捨五入）
              example: 280

  responses:
    InternalError:
      description: 伺服器內部錯誤（DB 連線失敗、SQL 執行錯誤等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: error
            message: 'pq: relation "eco_restaurant" does not exist'
