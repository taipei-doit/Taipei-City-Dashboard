openapi: 3.0.3
info:
  title: 市民綠色飲食行為流程儀表板 — 後端 API
  description: |
    對應 DE 規劃 [`08_市民綠色飲食行為流程儀表板_DE實作規劃_儀表板一.md`](../twin-cities-coding-festival/題目評估報告/永續環境/08_市民綠色飲食行為流程儀表板_DE實作規劃_儀表板一.md)。

    ## Component → Endpoint 對照

    | Component | Endpoint | Response 型別 | FE 渲染 |
    |---|---|---|---|
    | C1a 環保餐廳點位地圖 | `GET /eco_diet/restaurant/points` | `EcoRestaurantPoint[]` | Mapbox 點位 |
    | C1b 環保餐廳行政區密度 | `GET /eco_diet/restaurant/density-by-district` | `TwoDimensionalDataOutput[]` | ApexCharts BarChart |
    | C2 雙城家數數字卡 | `GET /eco_diet/restaurant/count-by-city` | `TwoDimensionalDataOutput[]` | KPI 數字卡 |
    | C3 環保餐廳篩選列表 | `GET /eco_diet/restaurant/list` | `EcoRestaurantPoint[]` | 表格＋Mapbox 過濾 |
    | C4 綠色商店點位 | `GET /eco_diet/green_store/points` | `GreenStorePoint[]` | Mapbox 點位 |
    | C5 雙北廢棄物年趨勢 | `GET /eco_diet/waste/yearly` | `ThreeDimensionalDataOutput[]` + `categories[]` | ApexCharts LineChart |
    | C5b 雙北廢棄物年碳足跡 | `GET /eco_diet/waste/carbon_footprint_yearly` | `ThreeDimensionalDataOutput[]` + `categories[]` | ApexCharts LineChart |
    | C7a 實物銀行點位 | `GET /eco_diet/food_bank/points` | `FoodBankPoint[]` | Mapbox 點位 |
    | C7b 最近實物銀行（Haversine） | `GET /eco_diet/food_bank/nearby` | `FoodBankPointNearby[]` | FE 顯示 top-3 卡片 |

    ## 設計慣例（對齊 mrtA11y）

    - **點位類 endpoint**（C1a / C3 / C4 / C7a / C7b）回傳**領域專屬 struct**（含 `lng` / `lat` + 該表特有欄位），
      參考既有 [`MrtA11yStation`](../Taipei-City-Dashboard-BE/app/models/mrtA11y.go#L26)。
    - **聚合類 endpoint**（C1b / C2 / C5）沿用 [`componentData.go`](../Taipei-City-Dashboard-BE/app/models/componentData.go) 既有的 `TwoDimensionalDataOutput` / `ThreeDimensionalDataOutput`，**不新增型別**。
    - **C7b Haversine 排序**：對齊 [`GetMrtStationsNearby`](../Taipei-City-Dashboard-BE/app/models/mrtA11y.go#L179) 既有實作（Go side 計算、無 PostGIS 空間查詢，因為 80 筆量級極小）。

    ## Response 信封

    所有 endpoint 統一遵循 BE 既有約定：
    ```json
    { "status": "success", "data": <payload>, "categories"?: [...], "message"?: "..." }
    ```
    錯誤時：`{ "status": "error", "message": "<error string>" }`。
  version: 1.0.0
  contact:
    name: Taipei-City-Dashboard 雙北黑客松組

servers:
  - url: http://localhost:8080/api/v1
    description: 本機開發
  - url: https://citydashboard.taipei/api/v1
    description: Production

tags:
  - name: eco_diet_restaurant
    description: 雙北環保餐廳（C1a / C1b / C2 / C3）
  - name: eco_diet_green_store
    description: 雙北綠色商店（C4）
  - name: eco_diet_waste
    description: 雙北廚餘量年趨勢與年碳足跡（C5 / C5b）
  - name: eco_diet_food_bank
    description: 雙北實物銀行（C7）

paths:
  # ─────────────────────────── C1a ───────────────────────────
  /eco_diet/restaurant/points:
    get:
      tags: [eco_diet_restaurant]
      summary: C1a — 環保餐廳全量點位
      description: |
        回傳所有雙北環保餐廳（約 1,228 筆）含座標、額外環保作為陣列等屬性。
        FE 用 Mapbox 渲染點位，顏色依 `city` 分（臺北 / 新北）。

        **SQL**
        ```sql
        SELECT
          source_dataset, seq_no, name, address, city, district, tel,
          env_actions, lng, lat
        FROM eco_restaurant
        WHERE wkb_geometry IS NOT NULL
        ORDER BY city, district, name;
        ```
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EcoRestaurantPoint'
              example:
                status: success
                data:
                  - source_dataset: tpe_00002761
                    seq_no: '1'
                    name: '《扶風堂》披薩。義麵。吉拉朵'
                    address: '臺北市松山區敦化北路165巷5號1樓'
                    city: '臺北市'
                    district: '松山區'
                    tel: '(02)27153377'
                    env_actions: ['環境管理', '惜食(善用食材)', '環境教育']
                    lng: 121.5495
                    lat: 25.0556
                  - source_dataset: tpe_00002761
                    seq_no: '42'
                    name: '微風信義美食街'
                    address: '臺北市信義區忠孝東路五段68號'
                    city: '臺北市'
                    district: '信義區'
                    tel: '(02)66362699'
                    env_actions: ['惜食(善用食材)']
                    lng: 121.5673
                    lat: 25.0410
                  - source_dataset: ntpe_e90d14f8
                    seq_no: '1'
                    name: '31早午餐'
                    address: '新北市蘆洲區和平路171號'
