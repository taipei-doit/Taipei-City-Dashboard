  # ─────────────────────────── C1b ───────────────────────────
  /eco_diet/restaurant/density-by-district:
    get:
      tags: [eco_diet_restaurant]
      summary: C1b — 環保餐廳行政區密度
      description: |
        回傳每個行政區的環保餐廳家數，依家數降冪排序。

        **SQL**
        ```sql
        SELECT district AS x_axis, COUNT(*)::float AS data
        FROM eco_restaurant
        WHERE district IS NOT NULL
          AND ($1::text IS NULL OR city = $1)
        GROUP BY district
        ORDER BY data DESC;
        ```
      parameters:
        - in: query
          name: city
          required: false
          description: 限縮到單一城市；省略時回雙北合併。
          schema:
            type: string
            enum: ['臺北市', '新北市']
            example: '臺北市'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TwoDimensionalDataOutput'
              examples:
                bothCities:
                  summary: 雙北合併（無 city 參數）
                  value:
                    status: success
                    data:
                      - data:
                          - { x: '板橋區', y: 78 }
                          - { x: '新莊區', y: 62 }
                          - { x: '信義區', y: 51 }
                          - { x: '大安區', y: 47 }
                          - { x: '中山區', y: 44 }
                          - { x: '中和區', y: 41 }
                          - { x: '松山區', y: 38 }
                          - { x: '士林區', y: 35 }
                          - { x: '永和區', y: 32 }
                          - { x: '內湖區', y: 30 }
                taipeiOnly:
                  summary: city=臺北市
                  value:
                    status: success
                    data:
                      - data:
                          - { x: '信義區', y: 51 }
                          - { x: '大安區', y: 47 }
                          - { x: '中山區', y: 44 }
                          - { x: '松山區', y: 38 }
                          - { x: '士林區', y: 35 }
                          - { x: '內湖區', y: 30 }
                          - { x: '萬華區', y: 28 }
                          - { x: '北投區', y: 25 }
                          - { x: '南港區', y: 22 }
                          - { x: '中正區', y: 21 }
                          - { x: '文山區', y: 19 }
