  # ─────────────────────────── C2 ───────────────────────────
  /eco_diet/restaurant/count-by-city:
    get:
      tags: [eco_diet_restaurant]
      summary: C2 — 雙城環保餐廳家數
      description: |
        固定回 2 列：臺北市、新北市的環保餐廳總家數。FE 渲染為兩張並排數字卡。

        **SQL**
        ```sql
        SELECT city AS x_axis, COUNT(*)::float AS data
        FROM eco_restaurant
        GROUP BY city
        ORDER BY x_axis;
        ```
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TwoDimensionalDataOutput'
              example:
                status: success
                data:
                  - data:
                      - { x: '臺北市', y: 479 }
                      - { x: '新北市', y: 749 }
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────── C3 ───────────────────────────
  /eco_diet/restaurant/list:
    get:
      tags: [eco_diet_restaurant]
      summary: C3 — 環保餐廳篩選列表
      description: |
        三個篩選參數（`district` / `action` / `city`）皆 optional，AND 組合。
        Response shape 與 C1a 相同（同 `EcoRestaurantPoint`）。

        **SQL**
        ```sql
        SELECT
          source_dataset, seq_no, name, address, city, district, tel,
          env_actions, lng, lat
        FROM eco_restaurant
        WHERE
              ($1::text IS NULL OR district = $1)
          AND ($2::text IS NULL OR $2 = ANY(env_actions))
          AND ($3::text IS NULL OR city = $3)
          AND wkb_geometry IS NOT NULL
        ORDER BY city, district, name;
        ```

        **重要**：`action` 參數對應 `env_actions text[]` 的 ANY match；
        新北側資料**沒有 `額外環保作為` 欄位**（DE plan §11 修正 #3），
        若 `action` 有值，新北資料會被過濾掉是預期行為，FE 應於介面標註「此篩選僅適用臺北市資料」。
      parameters:
        - in: query
          name: district
          required: false
          description: 行政區嚴格 match（如 `松山區` / `板橋區`）
          schema:
            type: string
            example: '松山區'
        - in: query
          name: action
          required: false
          description: 額外環保作為標籤（如 `惜食(善用食材)`、`環境教育`）；對 `env_actions` 陣列做 `= ANY` match。**僅臺北市資料具備此欄位**
          schema:
            type: string
            example: '惜食(善用食材)'
        - in: query
          name: city
          required: false
          description: 城市嚴格 match
          schema:
            type: string
            enum: ['臺北市', '新北市']
            example: '臺北市'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EcoRestaurantPoint'
              examples:
                filteredByDistrictAndAction:
                  summary: 'district=松山區 & action=惜食(善用食材)'
                  value:
                    status: success
                    data:
                      - source_dataset: tpe_00002761
                        seq_no: '1'
                        name: '《扶風堂》披薩。義麵。吉拉朵'
                        address: '臺北市松山區敦化北路165巷5號1樓'
                        city: '臺北市'
                        district: '松山區'
                        tel: '(02)27153377'
                        env_actions: ['環境管理', '惜食(善用食材)', '環境教育']
                        lng: 121.5495
                        lat: 25.0556
                emptyResult:
                  summary: 篩選後無結果
                  value:
                    status: success
                    data: []
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────── C4 ───────────────────────────
  /eco_diet/green_store/points:
    get:
      tags: [eco_diet_green_store]
      summary: C4 — 綠色商店全量點位（含篩選）
      description: |
        回傳所有雙北綠色商店（約 3,691 筆）含座標。FE 用 Mapbox 渲染點位，
        顏色依 `store_type`（連鎖型 / 一般型）區分。

        **資料量警示**：3,691 筆全量回傳壓力可接受（payload 約 1.5 MB），
        若 FE 體感慢可加 `?city=` 切分（雙北各約 1,640 / 2,051 筆）。

        **SQL**
        ```sql
        SELECT
          source_dataset, store_code, name, address, city, district, tel,
          store_type, lng, lat
        FROM green_store
        WHERE wkb_geometry IS NOT NULL
          AND ($1::text IS NULL OR store_type = $1)
          AND ($2::text IS NULL OR city = $2)
        ORDER BY city, district, name;
        ```
      parameters:
        - in: query
          name: store_type
          required: false
          description: 商店類型篩選
          schema:
            type: string
            enum: ['連鎖型綠色商店', '一般型綠色商店']
            example: '連鎖型綠色商店'
        - in: query
          name: city
          required: false
          schema:
            type: string
            enum: ['臺北市', '新北市']
      responses:
        '200':
