                    address: '臺北市士林區基河路128號'
                    city: '臺北市'
                    district: '士林區'
                    tel: '(02)27478711'
                    store_type: '連鎖型綠色商店'
                    lng: 121.5238
                    lat: 25.0902
                  - source_dataset: ntpe_6ccd0274
                    store_code: F002166
                    name: '台象股份有限公司-象印板橋服務中心'
                    address: '新北市板橋區國光路52號1樓'
                    city: '新北市'
                    district: '板橋區'
                    tel: '02-2506-9009#217'
                    store_type: '連鎖型綠色商店'
                    lng: 121.4673
                    lat: 25.0205
        '500':
